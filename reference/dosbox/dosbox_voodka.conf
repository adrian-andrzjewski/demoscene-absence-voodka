# DOSBox 0.74-3 configuration for running the original 1996 VOODKA.EXE
# as the behavioral reference. Used by capture_reference.ps1.
#
# The demo needs: 386+ with FPU, 8 MB RAM, SB or GUS ("SB & GUZ ONLY").
# DOSBox provides XMS (EOS XMS_trapper), emulated FPU, and SB16 at the
# standard 220h/IRQ7/DMA1/HDMA5. Timing is retrace-synced (~70 Hz), so
# wall-clock scene timing matches real hardware.

[sdl]
fullscreen=false
windowresolution=640x480
output=surface
priority=higher

[dosbox]
captures=D:\Project\voodka2\reference\captures\raw
machine=svga_s3
memsize=16

[render]
frameskip=0
aspect=true

[cpu]
core=dynamic
cputype=auto
cycles=max

[mixer]
rate=44100
blocksize=1024
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto

[autoexec]
mount c "D:\Project\voodka2\reference\release\abc_voda"
c:
VOODKA.EXE
exit
